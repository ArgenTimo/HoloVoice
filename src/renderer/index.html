<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream:">
  <title>HoloVoice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="panel">
  <div id="app">
    <header class="titlebar">
      <div class="brand"><span class="dot"></span>HoloVoice</div>
      <div class="win-btns">
        <button id="btn-lang" class="lang-btn" data-i18n-title="lang.title"></button>
        <button id="btn-widget" data-i18n-title="win.widget">🧩</button>
        <button id="btn-compact" data-i18n-title="win.compact">▭</button>
        <button id="btn-pin" class="on" data-i18n-title="win.pin">📌</button>
        <button id="btn-min" data-i18n-title="win.min">—</button>
        <button id="btn-close" data-i18n-title="win.close">✕</button>
      </div>
    </header>

    <main class="layout">
      <aside class="lanes" id="lanes"></aside>

      <section class="catalog">
        <div class="cat-head">
          <span data-i18n="cat.for"></span>
          <b id="cat-lane"></b>
          <span class="muted" data-i18n="cat.hint"></span>
        </div>
        <div class="groups" id="groups"></div>
      </section>

      <aside class="inspector" id="inspector"></aside>
    </main>

    <footer class="bar">
      <label class="dev" data-i18n-title="dev.mic">🎙️ <select id="mic"></select></label>
      <span class="arrow">→</span>
      <label class="dev" data-i18n-title="dev.out"><select id="out"></select></label>
      <label class="check" data-i18n-title="dev.monitorTip"><input type="checkbox" id="monitor"> <span data-i18n="dev.monitor"></span></label>
      <input type="range" id="monitor-vol" min="0" max="100" step="1" data-i18n-title="dev.monitorVol">
      <span class="spacer"></span>
      <button class="ghost" id="open-hk" data-i18n="btn.hotkeys"></button>
      <button class="ghost" id="open-osd" data-i18n="btn.osd"></button>
      <span class="ver" id="version"></span>
      <button class="ghost" id="btn-update" data-i18n-title="btn.updateTip" data-i18n="btn.update"></button>
      <span class="upd" id="update-status"></span>
    </footer>

    <div class="lang-menu" id="lang-menu" hidden></div>

    <div class="modal" id="modal-hk" hidden>
      <div class="sheet wide">
        <header><b data-i18n="hk.title"></b><button class="x" data-close>✕</button></header>
        <p class="note" data-i18n="hk.note"></p>
        <div class="hk-cols">
          <div><h4>🎙️ <span data-i18n="lane.mic"></span></h4><div class="hk-list" id="hk-mic"></div></div>
          <div><h4>🔊 <span data-i18n="lane.sys"></span></h4><div class="hk-list" id="hk-sys"></div></div>
        </div>
        <footer><button class="ghost" id="hk-reset" data-i18n="hk.resetAll"></button></footer>
      </div>
    </div>

    <div class="modal" id="modal-osd" hidden>
      <div class="sheet">
        <header><b data-i18n="osd.title"></b><button class="x" data-close>✕</button></header>
        <label class="check"><input type="checkbox" id="osd-toast"> <span data-i18n="osd.toast"></span></label>
        <label class="check"><input type="checkbox" id="osd-bar"> <span data-i18n="osd.bar"></span></label>
        <div class="pos-label" data-i18n="osd.where"></div>
        <div class="pos-grid" id="osd-pos">
          <button data-pos="top-left">↖</button><button data-pos="top">↑</button><button data-pos="top-right">↗</button>
          <button data-pos="bottom-left">↙</button><button data-pos="bottom">↓</button><button data-pos="bottom-right">↘</button>
        </div>
        <p class="note" data-i18n="osd.note"></p>
        <footer><button class="ghost" id="osd-test" data-i18n="osd.test"></button></footer>
      </div>
    </div>
  </div>
  <script src="../../dist/panel.js"></script>
</body>
</html>
