<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>HoloVoice виджет</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="widget">
  <div id="app">
    <header class="titlebar">
      <div class="brand"><span class="dot"></span>HoloVoice</div>
      <div class="win-btns">
        <button id="btn-panel" title="Открыть полные настройки">⚙</button>
        <button id="btn-unpin" title="Открепить виджет">✕</button>
      </div>
    </header>
    <div class="w-row" data-lane="mic">
      <span class="w-ico" title="Мой голос">🎙️</span>
      <select class="w-fx"></select>
      <button class="w-sw" title="Ctrl+Alt+V"><i></i></button>
      <div class="w-bar"><i></i></div>
    </div>
    <div class="w-row" data-lane="sys">
      <span class="w-ico" title="Звук компьютера">🔊</span>
      <select class="w-fx"></select>
      <button class="w-sw" title="Ctrl+Alt+B"><i></i></button>
      <div class="w-bar"><i></i></div>
    </div>
  </div>
  <script src="../../dist/widget.js"></script>
</body>
</html>
