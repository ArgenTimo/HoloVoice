<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>HoloVoice widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="widget">
  <div id="app">
    <header class="titlebar">
      <div class="brand"><span class="dot"></span>HoloVoice</div>
      <div class="win-btns">
        <button id="btn-panel" data-i18n-title="widget.open"><i data-icon="settings"></i></button>
        <button id="btn-unpin" data-i18n-title="widget.unpin"><i data-icon="x"></i></button>
      </div>
    </header>
    <div class="w-row" data-lane="mic">
      <span class="w-ico" data-i18n-title="lane.mic"><i data-icon="mic" data-size="18"></i></span>
      <select class="w-fx"></select>
      <button class="w-sw"><i></i></button>
      <div class="w-bar"><i></i></div>
    </div>
    <div class="w-row" data-lane="sys">
      <span class="w-ico" data-i18n-title="lane.sys"><i data-icon="speaker" data-size="18"></i></span>
      <select class="w-fx"></select>
      <button class="w-sw"><i></i></button>
      <div class="w-bar"><i></i></div>
    </div>
  </div>
  <script src="../../dist/widget.js"></script>
</body>
</html>
