# Builds and tests the Windows computer-sound helper on a runner with a virtual sound card,
# then runs the real app end to end with the computer-sound lane.
name: win-sysaudio
on:
  push:
    paths: ['native/win-sysaudio/**', '.github/workflows/win-sysaudio.yml', 'src/sysaudio-win.js', 'src/renderer/engine.ts', 'src/renderer/dsp/worklet.ts']
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: LABSN/sound-ci-helpers@v1
      - uses: ilammy/msvc-dev-cmd@v1
      - name: build helper
        working-directory: native/win-sysaudio
        run: |
          rc /nologo holo-sysaudio.rc
          cl /nologo /EHsc /O2 /MT /std:c++17 /utf-8 holo-sysaudio.cpp holo-sysaudio.res /link /SUBSYSTEM:CONSOLE /MANIFEST:NO
      - name: helper test
        working-directory: native/win-sysaudio
        run: |
          pip install pycaw
          python test.py holo-sysaudio.exe
      - run: npm ci
      - run: npm run build:renderer
      - name: app end-to-end
        run: python native/win-sysaudio/e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holo-sysaudio
          path: |
            native/win-sysaudio/holo-sysaudio.exe
            app.log
