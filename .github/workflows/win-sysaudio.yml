# Builds and tests the Windows computer-sound helper on a runner with a virtual sound card.
name: win-sysaudio
on:
  push:
    paths: ['native/win-sysaudio/**', '.github/workflows/win-sysaudio.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: LABSN/sound-ci-helpers@v1
      - uses: ilammy/msvc-dev-cmd@v1
      - name: build
        working-directory: native/win-sysaudio
        run: cl /nologo /EHsc /O2 /MT /std:c++17 /utf-8 holo-sysaudio.cpp /link /SUBSYSTEM:CONSOLE
      - name: test
        working-directory: native/win-sysaudio
        run: |
          pip install pycaw
          python test.py holo-sysaudio.exe
      - uses: actions/upload-artifact@v4
        with:
          name: holo-sysaudio
          path: native/win-sysaudio/holo-sysaudio.exe
