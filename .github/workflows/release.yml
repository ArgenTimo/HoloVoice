# Every push to main (or master) → build the Windows installer and Linux AppImage → GitHub Release.
# The "Update" button in an installed HoloVoice fetches the new version from here (electron-updater).
# Both builds upload into a DRAFT release; it is published only when both succeeded, so users never see
# a "latest" release without the Windows installer or latest.yml.
name: release
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis
          - os: ubuntu-latest
            target: --linux AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm version --no-git-tag-version 1.0.${{ github.run_number }}
      - run: npm run typecheck
      - run: npm run build:renderer
      # computer-sound helper for Windows (see native/win-sysaudio)
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - if: runner.os == 'Windows'
        working-directory: native/win-sysaudio
        run: cl /nologo /EHsc /O2 /MT /std:c++17 /utf-8 holo-sysaudio.cpp /link /SUBSYSTEM:CONSOLE
      - run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: publish the draft, with release notes and a stable installer name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.${{ github.run_number }}
        run: |
          git log -1 --pretty=%B | grep -v '^Co-Authored-By' > notes.md
          gh release download "$TAG" -p 'HoloVoice-Setup-*.exe' -D out
          cp out/HoloVoice-Setup-*.exe out/HoloVoice-Setup.exe
          gh release upload "$TAG" out/HoloVoice-Setup.exe --clobber
          gh release edit "$TAG" --draft=false --latest --notes-file notes.md
