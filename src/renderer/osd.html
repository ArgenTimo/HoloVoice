<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <title>HoloVoice OSD</title>
  <style>
    html, body { margin: 0; height: 100%; background: #12131a; overflow: hidden; user-select: none;
      font: 600 14px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
    #root { box-sizing: border-box; height: 100%; display: flex; flex-direction: column; border: 2px solid #7c5cff; }
    #root.off { border-color: #3a3d4d; color: #8a8ea3; }
    #root.sys { border-color: #22d3ee; }
    #root.baronly { border: 0; padding: 3px; }
    .toast { flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 12px; min-width: 0; }
    .toast > div { flex: 1; min-width: 0; }
    #text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } /* long custom effect names */
    .ico { display: grid; place-items: center; width: 24px; height: 24px; color: #a78bfa; }
    #root.sys .ico { color: #22d3ee; }
    #root.off .ico { color: #8a8ea3; }
    .lane-row { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #8a8ea3; }
    .lane-row svg { display: block; }
    .pct { margin-left: auto; font-size: 11px; color: #8a8ea3; font-variant-numeric: tabular-nums; }
    .track { height: 6px; margin: 0 10px 8px; border-radius: 3px; background: #2a2d3b; overflow: hidden; }
    #root.baronly .track { height: 100%; margin: 0; border-radius: 4px; }
    .fill { height: 100%; width: 0; background: linear-gradient(90deg, #7c5cff, #22d3ee); }
    #root.sys .fill { background: linear-gradient(90deg, #0891b2, #22d3ee); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="root">
    <div class="toast" id="toast">
      <span class="ico" id="ico"></span>
      <div><div class="lane-row"><span id="lane-ico"></span><span id="lane"></span></div><div id="text"></div></div>
      <span class="pct" id="pct"></span>
    </div>
    <div class="track" id="track"><div class="fill" id="fill"></div></div>
  </div>
  <script src="../../dist/osd.js"></script>
</body>
</html>
