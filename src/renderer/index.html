<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream:">
  <title>HoloVoice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="panel">
  <div id="app">
    <header class="titlebar">
      <button class="brand brand-btn" id="btn-holo" data-i18n-title="holo.title"><span class="dot"></span>HoloVoice <i class="caret" data-icon="chevronDown" data-size="14"></i></button>
      <div class="win-btns">
        <button id="btn-lang" class="lang-btn" data-i18n-title="lang.title"></button>
        <button id="btn-widget" data-i18n-title="win.widget"><i data-icon="widget"></i></button>
        <button id="btn-compact" data-i18n-title="win.compact"><i data-icon="shrink"></i></button>
        <button id="btn-pin" class="on" data-i18n-title="win.pin"><i data-icon="pin"></i></button>
        <button id="btn-min" data-i18n-title="win.min"><i data-icon="minus"></i></button>
        <button id="btn-close" data-i18n-title="win.close"><i data-icon="x"></i></button>
      </div>
    </header>

    <main class="layout" data-i18n-loading="app.loading">
      <aside class="lanes" id="lanes"></aside>

      <section class="catalog">
        <div class="cat-head">
          <div class="lane-tabs" id="lane-tabs" role="tablist"></div>
          <span class="spacer"></span>
          <input type="search" id="cat-search" data-i18n-placeholder="cat.search" autocomplete="off" spellcheck="false">
        </div>
        <div class="groups" id="groups"></div>
      </section>

      <aside class="inspector" id="inspector"></aside>
    </main>

    <footer class="bar">
      <button class="ghost" id="open-hk"><i data-icon="keyboard"></i><span data-i18n="btn.hotkeys"></span></button>
      <button class="ghost" id="open-osd"><i data-icon="monitor"></i><span data-i18n="btn.osd"></span></button>
      <span class="spacer"></span>
      <span class="ver" id="version"></span>
      <button class="ghost" id="btn-update" data-i18n-title="btn.updateTip"><i data-icon="refresh"></i><span data-i18n="btn.update"></span></button>
      <span class="upd" id="update-status"></span>
    </footer>

    <div class="lang-menu" id="lang-menu" hidden></div>
    <div class="holo-menu" id="holo-menu" hidden></div>

    <div class="modal" id="modal-hk" hidden>
      <div class="sheet wide">
        <header><b class="with-ico"><i data-icon="keyboard" data-size="18"></i><span data-i18n="hk.title"></span></b><button class="x" data-close><i data-icon="x" data-size="18"></i></button></header>
        <p class="note" data-i18n="hk.note"></p>
        <div class="hk-cols">
          <div><h4 class="with-ico"><i data-icon="mic"></i><span data-i18n="lane.mic"></span></h4><div class="hk-list" id="hk-mic"></div></div>
          <div><h4 class="with-ico"><i data-icon="speaker"></i><span data-i18n="lane.sys"></span></h4><div class="hk-list" id="hk-sys"></div></div>
        </div>
        <footer><button class="ghost" id="hk-reset" data-i18n="hk.resetAll"></button></footer>
      </div>
    </div>

    <div class="modal" id="modal-setup" hidden><div class="sheet wide setup" id="setup" role="dialog" aria-modal="true"></div></div>

    <div class="modal" id="modal-osd" hidden>
      <div class="sheet">
        <header><b class="with-ico"><i data-icon="monitor" data-size="18"></i><span data-i18n="osd.title"></span></b><button class="x" data-close><i data-icon="x" data-size="18"></i></button></header>
        <label class="check"><input type="checkbox" id="osd-toast"> <span data-i18n="osd.toast"></span></label>
        <label class="check"><input type="checkbox" id="osd-bar"> <span data-i18n="osd.bar"></span></label>
        <div class="pos-label" data-i18n="osd.where"></div>
        <div class="pos-grid" id="osd-pos">
          <button data-pos="top-left"><i data-icon="arrowUp" style="transform:rotate(-45deg)"></i></button><button data-pos="top"><i data-icon="arrowUp"></i></button><button data-pos="top-right"><i data-icon="arrowUp" style="transform:rotate(45deg)"></i></button>
          <button data-pos="bottom-left"><i data-icon="arrowUp" style="transform:rotate(-135deg)"></i></button><button data-pos="bottom"><i data-icon="arrowUp" style="transform:rotate(180deg)"></i></button><button data-pos="bottom-right"><i data-icon="arrowUp" style="transform:rotate(135deg)"></i></button>
        </div>
        <p class="note" data-i18n="osd.note"></p>
        <footer><button class="ghost" id="osd-test" data-i18n="osd.test"></button></footer>
      </div>
    </div>
  </div>
  <script src="../../dist/panel.js"></script>
</body>
</html>
